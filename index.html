<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Independence Day!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="mainCard">
    <div class="card-front" onclick="openCard()">
      <h1>🇮🇳 Tap to Open Your Surprise 🎁</h1>
    </div>

    <div class="card-content hidden" id="content">
      <h2>Happy Independence Day! 🎉</h2>
      <p>Unnga pathi oru chinna Fun Test... Ready-a?</p>
      
      <!-- Mini Game Section -->
      <div class="game-box">
        <p>Correct Order-la Colors Grid Select Pannunga:</p>
        <div class="color-btn saffron" onclick="checkColor('saffron')"></div>
        <div class="color-btn white" onclick="checkColor('white')"></div>
        <div class="color-btn green" onclick="checkColor('green')"></div>
      </div>

      <div id="finalMessage" class="hidden">
        <h3>✨ You're a True Patriot! ✨</h3>
        <p class="smile-quote">"Freedom in mind, Faith in words, Pride in our heart!"</p>
        <p>Wishing you and your family a great 15th August! 🚀</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
