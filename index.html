<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Independence Day 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- Opening -->
        <section class="screen opening-screen">

            <p class="date">15 • 08 • 2026</p>

            <h1>🇮🇳</h1>

            <h2>INDEPENDENCE DAY</h2>

            <p class="subtitle">
                A day to remember. A day to be proud.
            </p>

            <button onclick="startExperience()">
                BEGIN
            </button>

        </section>


        <!-- Main -->
        <section class="screen main-screen" id="mainScreen">

            <div class="flag">

                <div class="saffron"></div>

                <div class="white">
                    <div class="chakra">☸</div>
                </div>

                <div class="green"></div>

            </div>

            <h2>HAPPY INDEPENDENCE DAY</h2>

            <p>
                Celebrating freedom, unity and the spirit of India.
            </p>

            <button onclick="showFinal()">
                CONTINUE
            </button>

        </section>


        <!-- Final -->
        <section class="screen final-screen" id="finalScreen">

            <div class="final-flag">🇮🇳</div>

            <h2>JAI HIND</h2>

            <p class="final-date">
                15 • 08 • 2026
            </p>

            <div class="credit">
                A little creation by Jeeva,<br>
                with pride 🇮🇳
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
